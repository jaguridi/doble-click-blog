<div class="temas-chips">
  <button class="chip chip-on" data-tag="">Todo</button>
  {% for t in site.data.temas %}<button class="chip" data-tag="{{ t }}">{{ t }}</button>
  {% endfor %}
</div>
<input class="temas-search" type="search" placeholder="Filtrar por palabra...">
<p class="temas-empty" hidden>Nada por aquí. Prueba con otro tema o palabra.</p>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var chips = document.querySelectorAll('.temas-chips .chip');
  var search = document.querySelector('.temas-search');
  var items = document.querySelectorAll('.buscable');
  var groups = document.querySelectorAll('[data-group]');
  var empty = document.querySelector('.temas-empty');
  var activeTag = '';
  // Comparación insensible a acentos y mayúsculas: el chip puede venir con tilde
  // (ej. "ética", desde _data/temas.yml) y el tag del post sin tilde ("etica").
  function norm(s){ return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function apply(){
    var q = norm(search.value).trim();
    var visible = 0;
    items.forEach(function(it){
      var tags = ' ' + norm(it.getAttribute('data-tags')) + ' ';
      var text = norm(it.getAttribute('data-text'));
      var show = (!activeTag || tags.indexOf(' ' + norm(activeTag) + ' ') >= 0) && (!q || text.indexOf(q) >= 0);
      it.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    groups.forEach(function(g){
      var any = g.querySelectorAll('.buscable:not([style*="none"])').length > 0;
      g.style.display = any ? '' : 'none';
    });
    if (empty) empty.hidden = (visible !== 0);
  }
  chips.forEach(function(c){
    c.addEventListener('click', function(){
      chips.forEach(function(x){ x.classList.remove('chip-on'); });
      c.classList.add('chip-on');
      activeTag = c.getAttribute('data-tag') || '';
      apply();
    });
  });
  if (search) search.addEventListener('input', apply);
});
</script>
