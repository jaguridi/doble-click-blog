# --- Doble Click — blog diario de IA con perspectiva latinoamericana ---
title: Doble Click
tagline: Inteligencia artificial, con acento latinoamericano
description: >-
  Una mirada diaria a la inteligencia artificial, con perspectiva latinoamericana.
  Curada a partir de fuentes públicas. Una entrada por día.
author: Doble Click
lang: es
timezone: America/Santiago

# Metadatos para compartir: los arma _includes/seo.html (tarjeta grande, imagen por
# familia temática). Ya no se usa jekyll-seo-tag.

# Diseño propio (layouts en _layouts/). No usamos tema externo.
plugins:
  - jekyll-feed      # genera /feed.xml (RSS) — lo consume el newsletter
  - jekyll-sitemap   # genera /sitemap.xml para buscadores

# Feeds RSS. Por defecto jekyll-feed genera /feed.xml SOLO con los posts (blog diario)
# — ese es el del newsletter diario y no se toca. Acá agregamos un feed aparte para la
# colección "lecturas" en /feed-lecturas.xml, que es el que lee el Apps Script para el
# newsletter semanal de Doble Lectura.
feed:
  collections:
    lecturas:
      path: "feed-lecturas.xml"

# URL — dominio propio (subdominio) servido por GitHub Pages. Ver archivo CNAME.
url: "https://dobleclick.jaguridi.cl"
baseurl: ""

# Endpoint del Google Apps Script que gestiona alta / confirmación / baja del newsletter.
# Lo usan el formulario de suscripción (home y about) y las páginas /confirmar/ y /baja/.
# Si rehaces el deploy del Apps Script, actualiza la URL acá: es el único lugar.
newsletter_endpoint: "https://script.google.com/macros/s/AKfycbxIaD55gHoo-HfgP9jf9vV3JGEgCxMqvyRCVZN9PBFrgfqp-EoSx-H07Tpzal2R40Gjcg/exec"

# Publicar también posts con fecha "en el futuro". La routine a veces le pone al post
# una hora adelantada (huso horario); igual queremos que salga el día que se genera.
future: true

# Doble Lectura — análisis en profundidad de un paper/reporte. Colección aparte de _posts,
# para que no se mezcle con el blog diario (home, /entradas/) ni con el feed del newsletter.
collections:
  lecturas:
    output: true
    permalink: /doble-lectura/:title/
  # Versión en inglés: traducciones fieles del español, con el MISMO nombre de archivo
  # (slug en español incluido), que es lo que empareja las dos versiones. Van en
  # colecciones propias y no en _posts para que nunca se mezclen con site.posts: el
  # feed del diario (/feed.xml) lo lee el newsletter y tiene que seguir siendo solo
  # español. Ver _tools/traduccion_en.md y la sección "Versión en inglés" del README.
  en_posts:
    output: true
    permalink: /en/:year/:month/:day/:title:output_ext
  en_lecturas:
    output: true
    permalink: /en/doble-lectura/:title/

defaults:
  - scope: { path: "", type: "lecturas" }
    values:
      layout: lectura
  # El idioma de cada página sale de `lang` (español si no lo trae). Todo lo que cuelga
  # de en/ y las dos colecciones en inglés quedan en inglés sin tener que escribirlo en
  # cada archivo.
  - scope: { path: "en" }
    values:
      lang: en
  - scope: { path: "", type: "en_posts" }
    values:
      layout: post
      lang: en
  - scope: { path: "", type: "en_lecturas" }
    values:
      layout: lectura
      lang: en
  # La imagen social ya no va por defaults: _includes/seo.html elige la tarjeta de la
  # familia temática (assets/og/) o la general. Una página puede fijar la suya con
  # `image:` en su front matter.

# No publicar estos archivos en el sitio
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
