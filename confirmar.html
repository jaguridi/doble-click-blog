<div id="estado" class="confirm-box">
  <p class="confirm-loading">Confirmando tu suscripción…</p>
</div>
<script>
(function(){
  var token = new URLSearchParams(location.search).get('token');
  var box = document.getElementById('estado');
  if (!token) { box.innerHTML = '<p>El enlace está incompleto. Vuelve a suscribirte desde la portada.</p>'; return; }
  // El Apps Script valida el token contra la planilla y devuelve el resultado real
  // (suscripción confirmada / enlace no válido). Lo redirigimos en vez de "pingearlo"
  // a ciegas, para que el visitante vea lo que de verdad ocurrió.
  location.replace('{{ site.newsletter_endpoint }}?action=confirm&token=' + encodeURIComponent(token));
})();
</script>
