<div id="estado" class="confirm-box">
  <p class="confirm-loading">Confirmando tu suscripción…</p>
</div>
<script>
(function(){
  var token = new URLSearchParams(location.search).get('token');
  var box = document.getElementById('estado');
  if (!token) { box.innerHTML = '<p>El enlace está incompleto. Vuelve a suscribirte desde la portada.</p>'; return; }
  var done = false;
  function ok(){ if(done) return; done = true; box.innerHTML = '<h2 class="confirm-title">¡Suscripción confirmada! 📬</h2><p>Recibirás la próxima entrada por correo. Ya puedes cerrar esta página.</p><p><a href="{{ "/" | relative_url }}">Ir al blog →</a></p>'; }
  var img = new Image();
  img.onload = img.onerror = ok;
  img.src = 'https://script.google.com/macros/s/AKfycbxIaD55gHoo-HfgP9jf9vV3JGEgCxMqvyRCVZN9PBFrgfqp-EoSx-H07Tpzal2R40Gjcg/exec?action=confirm&token=' + encodeURIComponent(token);
  setTimeout(ok, 3000);
})();
</script>
