# adelantar o reordenar algo, edita `ORDEN.txt` en el inbox; un arreglo a mano acá
# dura hasta la publicación siguiente.
#
# Cuando la cola queda vacía, la rutina deja la lista como `[]` y el cuadro no se muestra.
