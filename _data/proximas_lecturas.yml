# La página /doble-lectura/ muestra las 3 primeras entradas de esta lista en el
# cuadro "Próximas lecturas".
#
# NO se edita a mano en el día a día: la rutina "publicador" REGENERA este archivo
# cada vez que publica (lunes, jueves y entregas especiales) a partir de lo que haya
# en la carpeta `pendientes/` del repo privado doble-lectura-inbox, en el orden en
# que se publicarán: primero lo que nombren `pendientes/ESPECIAL.txt` y
