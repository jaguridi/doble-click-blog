# Fuentes públicas que revisamos para Doble Click: versión curada por categorías.
#
# Esta es una muestra representativa, no la lista completa: cada categoría tiene muchas más
# fuentes de las que mostramos acá. La lista interna granular (señales de talento y capital,
# compras públicas, cuentas a monitorear, etc.) se mantiene en privado en fuentes_curacion.md.
#
# Cuando se aprueba una fuente sugerida por un lector, se agrega a la categoría que corresponda.
# La página /fuentes/ se arma sola a partir de este archivo.
#
# Versión en inglés (/en/sources/): lee la misma lista de fuentes y, para los textos, los
# campos terminados en `_en` (intro_en, criterio_en, nombre_en, texto_en, descripcion_en).
# Si una categoría nueva no los trae, la página en inglés muestra el texto en español
# hasta que alguien los agregue: no se rompe nada.

ultima_revision: "2026-09-28"

intro: >-
  Estas son las familias de fuentes públicas con que se arman las entradas, con ejemplos de cada
  una. No es la lista completa: la curación interna es más amplia y cambia con lo que va
  apareciendo. Algunas fuentes se leen cada día y otras, como los organismos y centros de
  investigación, en un barrido semanal.
intro_en: >-
  These are the families of public sources the posts are built from, with examples of each.
  It is not the complete list: the internal curation is broader and changes with what comes
  up. Some sources are read every day and others, like international bodies and research
  centers, in a weekly sweep.

criterio: >-
  Los agregadores y la prensa tecnológica sirven para enterarse de una noticia, pero la cita va al
  original: el documento, la norma, el comunicado o el paper. Cuando un medio republica un
  despacho de agencia, se cita a la agencia. Las cifras que una empresa publica sobre sí misma se
  presentan como cifras de la empresa.
criterio_en: >-
  Aggregators and the tech press are useful for learning about a story, but the citation goes
  to the original: the document, the regulation, the press release or the paper. When an
  outlet republishes a wire story, we cite the wire agency. Figures a company publishes about
  itself are presented as the company's figures.

niveles:
  - { nivel: 1, nombre: "Primaria u oficial", texto: "El documento, la norma, la sentencia o el organismo que decide. Una empresa es fuente primaria de lo que anuncia, no de lo bien que funciona.",
      nombre_en: "Primary or official", texto_en: "The document, the regulation, the ruling or the body that decides. A company is a primary source for what it announces, not for how well it works." }
  - { nivel: 2, nombre: "Independiente especializada", texto: "Investigación, centros académicos, sociedad civil y evaluadores que no venden lo que analizan.",
      nombre_en: "Independent specialist", texto_en: "Research, academic centers, civil society and evaluators who don't sell what they analyze." }
  - { nivel: 3, nombre: "Prensa", texto: "Medios que reportan, contrastan y a veces llegan primero. Se usan con su atribución.",
      nombre_en: "Press", texto_en: "Outlets that report, cross-check and sometimes get there first. Used with attribution." }
  - { nivel: 4, nombre: "Parte interesada", texto: "Quien habla de su propio producto o negocio: sus cifras se marcan como tales.",
      nombre_en: "Interested party", texto_en: "Whoever is talking about their own product or business: their figures are flagged as such." }

categorias:
  - nombre: "Laboratorios de IA frontera"
    descripcion: >-
      Los anuncios y la investigación de quienes construyen los modelos. Incluye a los
      laboratorios chinos, que llevan buena parte del ritmo de lanzamientos y aparecen seguido en
      las entradas. Son comunicados de empresa: confirman qué se lanzó, no si es el mejor.
    nombre_en: "Frontier AI labs"
    descripcion_en: >-
      Announcements and research from the people who build the models. Includes the Chinese labs,
      which set much of the pace of releases and show up often in the posts. These are company
      communications: they confirm what was released, not whether it is the best.
    fuentes:
      - { nombre: "Anthropic", url: "https://www.anthropic.com/news" }
      - { nombre: "OpenAI", url: "https://openai.com/news/" }
      - { nombre: "Google DeepMind", url: "https://deepmind.google/blog/" }
      - { nombre: "Meta AI", url: "https://ai.meta.com/blog/" }
      - { nombre: "Mistral AI", url: "https://mistral.ai/news/" }
