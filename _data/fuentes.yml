  - nombre: "Infraestructura, chips y energía"
    descripcion: >-
      La parte física de la IA: centros de datos, semiconductores y cuánta electricidad consume
      todo esto. Nvidia y TSMC son parte interesada, porque venden lo que describen, así que los usamos
      para saber qué se anunció y qué se está fabricando, no para medir el tamaño del fenómeno.
      Para eso están la IEA y SemiAnalysis, que no venden chips.
    nombre_en: "Infrastructure, chips and energy"
    descripcion_en: >-
      The physical side of AI: data centers, semiconductors and how much electricity all of this
      uses. Nvidia and TSMC are interested parties, because they sell what they describe, so we
      use them to know what was announced and what is being manufactured, not to measure the size
      of the phenomenon. That is what the IEA and SemiAnalysis are for, since they don't sell
      chips.
    fuentes:
      - { nombre: "IEA, Energy and AI", url: "https://www.iea.org/reports/key-questions-on-energy-and-ai" }
      - { nombre: "SemiAnalysis", url: "https://semianalysis.com/" }
      - { nombre: "Nvidia", url: "https://blogs.nvidia.com/" }
      - { nombre: "TSMC", url: "https://pr.tsmc.com/english/news" }

  - nombre: "Investigación con curaduría"
    descripcion: "Papers ya filtrados por relevancia, más fáciles de seguir que arXiv en crudo."
    nombre_en: "Curated research"
    descripcion_en: >-
      Papers already filtered for relevance, easier to follow than raw arXiv.
    fuentes:
