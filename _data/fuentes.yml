  - nombre: "Sociedad civil y política tecnológica"
    descripcion: >-
      Organizaciones que investigan y vigilan cómo se regula y se usa la IA. Estas trabajan sobre
      todo el debate global, europeo y estadounidense; las de la región van aparte, más abajo.
    nombre_en: "Civil society and tech policy"
    descripcion_en: >-
      Organizations that research and monitor how AI is regulated and used. These work mostly on
      the global, European and US debate; the region's organizations are listed separately,
      further down.
    fuentes:
