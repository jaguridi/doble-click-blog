# Textos de la interfaz en los dos idiomas del sitio.
#
# Los layouts y los includes no escriben texto visible: lo leen de acá, con la clave del
# idioma de la página (ver _includes/idioma.html, que deja `t` apuntando a es: o a en:).
# Las dos ramas tienen que tener las mismas claves: una que falte en inglés sale vacía,
# no en español.
#
# El contenido (entradas, lecturas, Método) no vive acá sino en sus propios archivos:
# _posts/ y _en_posts/, _lecturas/ y _en_lecturas/, about.md y en/about.md.

