name: Audio de Doble Lectura

# Genera el mp3 del resumen hablado de cada lectura usando Piper (TTS de codigo
# abierto, gratis, sin llaves). Se dispara cuando aparece o cambia un guion en
# _audio/. Lee _audio/<slug>.txt y deja assets/audio/<slug>.mp3.

on:
  push:
    branches: [main]
    paths:
      - '_audio/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar edge-tts
        run: pipx install edge-tts

      - name: Generar audios faltantes
        env:
          VOICE: es-CL-LorenzoNeural
        run: |
          set -e
          mkdir -p assets/audio
          shopt -s nullglob
          generados=0
          for f in _audio/*.txt; do
            slug="$(basename "$f" .txt)"
            out="assets/audio/$slug.mp3"
            if [ ! -f "$out" ]; then
              echo "Generando $out con $VOICE"
              edge-tts --voice "$VOICE" --file "$f" --write-media "$out"
              generados=$((generados+1))
            fi
          done
          echo "Audios generados: $generados"

      - name: Commitear audios
        run: |
          git config user.name "doble-lectura-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          if git diff --cached --quiet; then
            echo "Nada nuevo que commitear"
          else
            git commit -m "Audio: genera mp3 de resumenes [skip ci]"
            git push
          fi
