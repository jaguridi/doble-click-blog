name: Audio de Doble Click / Doble Lectura

# Genera el mp3 del resumen hablado de cada entrada usando ElevenLabs
# (eleven_multilingual_v2), via el script _tools/tts_elevenlabs.py. Se dispara
# cuando aparece o cambia un guion en _audio/. Lee _audio/<slug>.txt +
# _audio/<slug>.voice y deja assets/audio/<slug>.mp3.
# Requiere el secret ELEVENLABS_API_KEY en el repo.

on:
  push:
    branches: [main]
    paths:
      - '_audio/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar audios faltantes (ElevenLabs)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python _tools/tts_elevenlabs.py

      # Deja _data/voces.yml al día para que la página pueda mostrar quién narra
      # (Jekyll no puede leer _audio/ directamente: empieza con "_").
      - name: Actualizar el mapa de voces
        run: python _tools/voces_yml.py

      - name: Commitear audios
        run: |
          git config user.name "doble-lectura-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio _data/voces.yml
          if git diff --cached --quiet; then
            echo "Nada nuevo que commitear"
          else
            git commit -m "Audio: genera mp3 de resumenes (ElevenLabs)"
            git push
          fi
