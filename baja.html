<div id="estado" class="confirm-box">
  <p class="confirm-loading">Procesando tu baja…</p>
</div>
<script>
(function(){
  var token = new URLSearchParams(location.search).get('token');
  var box = document.getElementById('estado');
  if (!token) { box.innerHTML = '<p>El enlace está incompleto.</p>'; return; }
  // El Apps Script valida el token y devuelve el resultado real (baja hecha / enlace
  // no válido). Lo redirigimos en vez de "pingearlo" a ciegas, para no mentir un éxito.
  location.replace('{{ site.newsletter_endpoint }}?action=unsub&token=' + encodeURIComponent(token));
})();
</script>
